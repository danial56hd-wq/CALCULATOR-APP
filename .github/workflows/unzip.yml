name: Unzip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip and replace old files
        shell: bash
        run: |
          shopt -s nullglob
          found=0

          for f in *.zip; do
            found=1
            echo "📦 Extracting: $f"
            
            # فك الضغط
            unzip -o "$f" -d .
            
            # البحث عن المجلد الداخلي (مثل CALCULATOR-APP-main)
            for dir in */; do
              if [ -d "$dir" ] && [ "$dir" != ".git/" ] && [ "$dir" != ".github/" ]; then
                echo "📁 Moving contents from $dir to root..."
                # نقل كل الملفات من المجلد الداخلي إلى الجذر (مع الاستبدال)
                shopt -s dotglob
                mv -f "$dir"* . 2>/dev/null || true
                shopt -u dotglob
                # حذف المجلد الفارغ
                rmdir "$dir" 2>/dev/null || rm -rf "$dir"
              fi
            done
            
            # حذف ملف الـ ZIP
            rm -f -- "$f"
            echo "✅ Done with $f"
          done

          if [ "$found" -eq 0 ]; then
            echo "❌ ERROR: No ZIP files found in the repository"
            exit 1
          fi

          echo "📋 Current files after extraction:"
          ls -la

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
            exit 0
          fi
          
          git commit -m "Unzip and replace project files with new version"
          git push
