name: Unzip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip and replace old version
        shell: bash
        run: |
          set -e
          shopt -s nullglob

          zipfiles=(*.zip)
          if [ ${#zipfiles[@]} -eq 0 ]; then
            echo "❌ لا يوجد أي ملف ZIP"
            exit 1
          fi

          for f in "${zipfiles[@]}"; do
            echo "📦 جاري فك ضغط: $f"
            unzip -o "$f" -d temp_extract

            if [ -d temp_extract/CALCULATOR-APP-main ]; then
              echo "🔄 استبدال الملفات (مع حماية ملفات الـ workflows)..."
              
              # حذف مجلد .github من النسخة المستخرجة حتى لا يعدل الـ workflows
              rm -rf temp_extract/CALCULATOR-APP-main/.github
              
              # استبدال الملفات
              rm -f index.html sw.js manifest.webmanifest
              cp -a temp_extract/CALCULATOR-APP-main/. .
            else
              rm -rf temp_extract/.github
              cp -a temp_extract/. .
            fi

            rm -rf temp_extract
            rm -f "$f"
            echo "🗑️ تم حذف $f"
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          if git diff --cached --quiet; then
            echo "ℹ️ لا توجد تغييرات"
            exit 0
          fi
          
          git commit -m "Unzip new version and replace old files"
          git pull --rebase origin main || true
          git push
