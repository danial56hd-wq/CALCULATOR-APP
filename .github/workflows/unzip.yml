name: Unzip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Unzip files
        shell: bash
        run: |
          shopt -s nullglob
          found=0

          for f in *.zip; do
            found=1
            echo "Extracting: $f"
            unzip -o "$f" -d .
            rm -- "$f"
          done

          if [ "$found" -eq 0 ]; then
            echo "ERROR: No ZIP files found in repository root."
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Unzip project files"
          git push
