name: Unzip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip and replace old version
        shell: bash
        run: |
          set -e
          shopt -s nullglob

          zipfiles=(*.zip)
          if [ ${#zipfiles[@]} -eq 0 ]; then
            echo "❌ لا يوجد أي ملف ZIP"
            exit 1
          fi

          for f in "${zipfiles[@]}"; do
            echo "📦 جاري فك ضغط: $f"
            rm -rf "$RUNNER_TEMP/extract"
            mkdir -p "$RUNNER_TEMP/extract"
            unzip -q -o "$f" -d "$RUNNER_TEMP/extract"

            entries=("$RUNNER_TEMP"/extract/*)
            if [ ${#entries[@]} -eq 1 ] && [ -d "${entries[0]}" ]; then
              src="${entries[0]}"
            else
              src="$RUNNER_TEMP/extract"
            fi

            echo "🔄 استبدال الملفات..."
            find . -mindepth 1 -maxdepth 1 \
              ! -name '.git' ! -name '.github' ! -name '*.zip' \
              -exec rm -rf {} +

            tar -C "$src" --exclude='./.github' -cf - . | tar -xf -

            rm -f "$f"
          done

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "لا توجد تغييرات"
            exit 0
          fi
          git commit -m "Unzip new version and replace old files"
          git pull --rebase origin main
          git push origin HEAD:main
